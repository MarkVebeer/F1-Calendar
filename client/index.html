<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Formula 1 schedule at a glance: every session in your timezone, with a countdown, circuit drawings and weekend weather." />
    <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c8232f'/%3E%3Cpath d='M9 22V10h9M9 16h7M21 22V10l-2.5 2' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>F1 Calendar</title>
    <style>
      /* The page's background before the stylesheet arrives, so the first frame is never white.
         Same rules as --bg in calendar.css: dark by default, light when the system or the theme switch says so. */
      :root { background: #0b0c0f; color-scheme: dark; }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) { background: #f3f4f6; color-scheme: light; }
      }
      :root[data-theme="light"] { background: #f3f4f6; color-scheme: light; }
    </style>
    <script>
      // Apply a stored light or dark choice before the first paint, so the page never flashes the other theme.
      try {
        var theme = localStorage.getItem('f1-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
      } catch (error) {}

      // Focus rings only for people moving through the page with the keyboard. A tap or click never shows one,
      // not even when focus returns to a card after a sheet closes. Typing in a field does not count.
      ;(function () {
        var root = document.documentElement
        var navKeys = { Tab: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, Home: 1, End: 1 }
        document.addEventListener('keydown', function (event) {
          var target = event.target
          var typing = target && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName))
          if (event.key === 'Tab' || (navKeys[event.key] && !typing)) root.setAttribute('data-input', 'keyboard')
        }, true)
        document.addEventListener('pointerdown', function () {
          root.removeAttribute('data-input')
        }, true)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
